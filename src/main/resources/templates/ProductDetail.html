<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      th:with="pageTitle='ProductDetail'">
<head>
    <link th:href="@{/css/ProductDetail.css}" rel="stylesheet"/>
</head>
<body>
<div layout:fragment="content">
    <main class="container mx-auto px-6 py-8">
        <!-- Breadcrumb -->
        <div class="flex flex-wrap gap-2 text-sm mb-8">
            <a class="text-text-primary/60 dark:text-background-light/60 hover:text-primary" th:href="@{/}">Trang chủ</a>
            <span class="text-text-primary/60 dark:text-background-light/60">/</span>
            <a class="text-text-primary/60 dark:text-background-light/60 hover:text-primary" th:href="@{/sanpham}">Sản phẩm</a>
            <span class="text-text-primary/60 dark:text-background-light/60">/</span>
            <a class="text-text-primary/60 dark:text-background-light/60 hover:text-primary"
               th:if="${sanPham.loaiSanPham != null}"
               th:href="@{/sanpham(loai=${sanPham.loaiSanPham.maLoai})}"
               th:text="${sanPham.loaiSanPham.tenLoai}">Danh mục</a>
            <span class="text-text-primary/60 dark:text-background-light/60" th:if="${sanPham.loaiSanPham != null}">/</span>
            <span class="text-text-primary dark:text-background-light font-medium" th:text="${sanPham.tenSP}">Sản phẩm</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
            <!-- Hình ảnh sản phẩm - ƯU TIÊN HIỂN THỊ ẢNH -->
            <div class="flex items-start justify-center">
                <img class="w-full aspect-[3/4] max-h-[700px] object-cover rounded-xl shadow-lg"
                     th:src="${sanPham.anhChinh != null && !sanPham.anhChinh.isEmpty() ? sanPham.anhChinh : '/img/placeholder.png'}"
                     th:alt="${sanPham.tenSP}"
                     onerror="console.error('Image load error:', this.src); this.src='/img/placeholder.png'; this.onerror=null;"/>
            </div>

            <!-- Thông tin sản phẩm -->
            <div class="flex flex-col gap-6">
                <div>
                    <a class="text-sm font-medium tracking-widest uppercase text-text-primary/70 dark:text-background-light/70 hover:text-primary"
                       th:if="${sanPham.thuongHieu != null}"
                       th:href="@{/sanpham(thuongHieu=${sanPham.thuongHieu.maTH})}"
                       th:text="${sanPham.thuongHieu.tenTH}">Brand</a>
                    <h1 class="text-4xl lg:text-5xl font-serif-display font-bold text-text-primary dark:text-background-light mt-2"
                        th:text="${sanPham.tenSP}">Tên sản phẩm</h1>

                    <!-- Hiển thị giá -->
                    <p class="text-3xl mt-4 font-semibold text-text-primary dark:text-background-light" id="productPrice"
                       th:if="${minPrice != null && minPrice.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
                        <span th:if="${minPrice.equals(maxPrice)}"
                              th:text="${#numbers.formatDecimal(minPrice,0,'COMMA',0,'POINT')} + ' đ'">Giá</span>
                        <span th:if="${!minPrice.equals(maxPrice)}">
                            <span th:text="${#numbers.formatDecimal(minPrice,0,'COMMA',0,'POINT')} + ' - ' + ${#numbers.formatDecimal(maxPrice,0,'COMMA',0,'POINT')} + ' đ'">Giá</span>
                        </span>
                    </p>
                    <p class="text-3xl mt-4 font-semibold text-text-primary dark:text-background-light"
                       th:if="${minPrice == null || minPrice.compareTo(T(java.math.BigDecimal).ZERO) == 0}">
                        Liên hệ
                    </p>
                </div>

                <!-- Lựa chọn Màu sắc - BẮT BUỘC CHỌN -->
                <div class="border-t border-text-secondary/30 pt-6" th:if="${variants != null and !variants.isEmpty()}">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-sm font-bold uppercase tracking-wider text-text-primary dark:text-background-light">
                            MÀU SẮC: <span class="font-normal text-primary" id="selectedColorName">Chọn màu</span>
                        </label>
                    </div>
                    <div class="flex gap-3 flex-wrap" id="colorOptions">
                        <!-- Hiển thị tất cả màu, JavaScript sẽ loại bỏ trùng -->
                        <th:block th:each="variant : ${variants}">
                            <button th:if="${variant.mauSacSP != null}"
                                    class="relative size-12 rounded-full border-2 border-text-secondary/30 hover:border-primary transition-all duration-200 color-btn shadow-md hover:shadow-lg"
                                    th:style="${'background-color: ' + (variant.mauSacSP.maHex != null ? variant.mauSacSP.maHex : '#ccc')}"
                                    th:attr="data-color-name=${variant.mauSacSP.tenMau},data-color-id=${variant.mauSacSP.maMau},title=${variant.mauSacSP.tenMau}"
                                    onclick="selectColor(this)">
                                <span class="absolute inset-0 rounded-full ring-2 ring-primary ring-offset-2 opacity-0 transition-opacity duration-200 selected-indicator"></span>
                            </button>
                        </th:block>
                    </div>
                </div>

                <!-- Lựa chọn Size - BẮT BUỘC CHỌN -->
                <div class="border-t border-text-secondary/30 pt-6" th:if="${variants != null and !variants.isEmpty()}">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-sm font-bold uppercase tracking-wider text-text-primary dark:text-background-light">
                            SIZE: <span class="font-normal text-primary" id="selectedSizeName">Chọn size</span>
                        </label>
                        <a class="text-xs underline text-text-primary/70 dark:text-background-light/70 hover:text-primary cursor-pointer" onclick="event.preventDefault(); alert('📏 Hướng dẫn chọn size:\n\nS: Ngực 86cm, Eo 70cm\nM: Ngực 90cm, Eo 74cm\nL: Ngực 94cm, Eo 78cm\nXL: Ngực 98cm, Eo 82cm');">Hướng dẫn chọn size</a>
                    </div>
                    <div class="flex flex-wrap gap-3" id="sizeOptions">
                        <!-- Hiển thị tất cả size, JavaScript sẽ loại bỏ trùng và cập nhật tồn kho -->
                        <th:block th:each="variant : ${variants}">
                            <button th:if="${variant.sizeSP != null}"
                                    class="min-w-[60px] px-4 py-3 border-2 border-text-secondary/30 rounded-lg text-sm font-medium hover:border-primary transition-all duration-200 size-btn disabled:opacity-40 disabled:cursor-not-allowed"
                                    th:text="${variant.sizeSP.tenSize}"
                                    th:attr="data-size-name=${variant.sizeSP.tenSize},data-size-id=${variant.sizeSP.maSize},data-stock=${variant.soLuongTon},data-variant-id=${variant.maBienThe},data-price=${variant.giaBan},data-color-id=${variant.mauSacSP?.maMau}"
                                    onclick="selectSize(this)">
                            </button>
                        </th:block>
                    </div>
                    <!-- Hiển thị tồn kho của size/màu được chọn -->
                    <div id="stockInfo" class="mt-3 text-sm hidden">
                        <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 rounded-lg">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                            </svg>
                            <span id="stockText">Còn hàng</span>
                        </span>
                    </div>
                </div>

                <!-- Số lượng -->
                <div class="border-t border-text-secondary/30 pt-6">
                    <label class="text-sm font-bold uppercase tracking-wider text-text-primary dark:text-background-light block mb-3">Số lượng</label>
                    <div class="flex items-center gap-3">
                        <button onclick="decreaseQuantity()" class="w-10 h-10 border-2 border-text-secondary/30 rounded-lg hover:border-primary transition-all duration-200 flex items-center justify-center font-bold text-xl">
                            −
                        </button>
                        <input type="number" id="quantity" value="1" min="1" max="99"
                               class="w-20 h-10 text-center border-2 border-text-secondary/30 rounded-lg focus:border-primary focus:outline-none font-semibold"/>
                        <button onclick="increaseQuantity()" class="w-10 h-10 border-2 border-text-secondary/30 rounded-lg hover:border-primary transition-all duration-200 flex items-center justify-center font-bold text-xl">
                            +
                        </button>
                    </div>
                </div>

                <!-- Nút hành động -->
                <div class="flex flex-col gap-4 mt-4">
                    <button id="addToCartBtn"
                            class="w-full bg-primary text-white h-14 rounded-lg text-base font-bold tracking-wider hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 shadow-lg hover:shadow-xl"
                            th:disabled="${totalStock == null || totalStock == 0}"
                            onclick="addProductToCart()">
                        <span th:text="${totalStock != null && totalStock > 0 ? '🛒 Thêm vào giỏ hàng' : '❌ Hết hàng'}">Thêm vào giỏ hàng</span>
                    </button>
                    <button class="w-full border-2 border-primary text-primary h-14 rounded-lg text-base font-bold tracking-wider hover:bg-primary hover:text-white dark:border-accent dark:text-accent dark:hover:bg-accent dark:hover:text-white transition-all duration-200"
                            th:disabled="${totalStock == null || totalStock == 0}"
                            onclick="buyNow()">
                        ⚡ Mua ngay
                    </button>
                </div>

                <!-- Mô tả sản phẩm -->
                <div class="border-t border-text-secondary/30 pt-6 space-y-4">
                    <details class="group" th:if="${sanPham.moTa != null}">
                        <summary class="flex justify-between items-center cursor-pointer list-none">
                            <span class="text-base font-medium">Mô tả sản phẩm</span>
                            <span class="transition-transform duration-300 group-open:rotate-45">
                                <span class="material-symbols-outlined">add</span>
                            </span>
                        </summary>
                        <p class="mt-4 text-sm text-text-primary/80 dark:text-background-light/80" th:text="${sanPham.moTa}">
                            Mô tả sản phẩm
                        </p>
                    </details>
                    <div class="border-t border-text-secondary/30" th:if="${sanPham.moTa != null}"></div>
                    <details class="group">
                        <summary class="flex justify-between items-center cursor-pointer list-none pt-4">
                            <span class="text-base font-medium">Thông tin chung</span>
                            <span class="transition-transform duration-300 group-open:rotate-45">
                                <span class="material-symbols-outlined">add</span>
                            </span>
                        </summary>
                        <ul class="mt-4 text-sm text-text-primary/80 dark:text-background-light/80 list-disc pl-5 space-y-1">
                            <li th:text="${'Thương hiệu: ' + (sanPham.thuongHieu != null ? sanPham.thuongHieu.tenTH : 'N/A')}">Thương hiệu</li>
                            <li th:text="${'Danh mục: ' + (sanPham.loaiSanPham != null ? sanPham.loaiSanPham.tenLoai : 'N/A')}">Danh mục</li>
                            <li th:text="${sanPham.gioiTinh == 0 ? 'Giới tính: Nam' : (sanPham.gioiTinh == 1 ? 'Giới tính: Nữ' : 'Giới tính: Unisex')}">Giới tính</li>
                            <li th:text="${'Tổng số lượng: ' + (totalStock != null ? totalStock : 0)}">Tổng tồn kho</li>
                        </ul>
                    </details>
                </div>
            </div>
        </div>

        <!-- Sản phẩm liên quan -->
        <div class="mt-24" th:if="${relatedProducts != null and !relatedProducts.isEmpty()}">
            <h2 class="text-3xl font-serif-display font-bold text-center mb-8">Sản phẩm liên quan</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-8">
                <div class="group" th:each="relProd : ${relatedProducts}">
                    <a th:href="@{/sanpham/{id}(id=${relProd.maSP})}" class="block">
                        <div class="relative w-full h-96 rounded-lg overflow-hidden">
                            <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                 th:src="${relProd.anhChinh}"
                                 th:alt="${relProd.tenSP}"
                                 onerror="this.src='/img/placeholder.png'"/>
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-50 transition-all duration-300 flex items-center justify-center">
                                <span class="text-white bg-primary bg-opacity-80 px-4 py-2 rounded-lg text-sm font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                    Xem chi tiết
                                </span>
                            </div>
                        </div>
                        <div class="mt-4 text-center">
                            <p class="text-xs uppercase tracking-wider text-text-primary/60 dark:text-background-light/60"
                               th:text="${relProd.thuongHieu != null ? relProd.thuongHieu.tenTH : 'Brand'}">Brand</p>
                            <h3 class="text-lg font-medium mt-1" th:text="${relProd.tenSP}">Tên sản phẩm</h3>
                            <p class="text-base text-text-primary/70 dark:text-background-light/70 mt-1">Liên hệ</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Script xử lý chọn màu/size và thêm giỏ hàng -->
<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        // Set variants data for ProductDetail.js to use - FIX: Parse properly
        selectedColorId = null;
        selectedSizeId = null;
        selectedVariantId = null;
        selectedStock = 0;
        selectedPrice = null;

        // Parse variants from Thymeleaf with proper structure
        const variantsRaw = /*[[${variants}]]*/ [];
        variants = [];

        // Convert Java objects to proper JavaScript objects
        if (variantsRaw && Array.isArray(variantsRaw)) {
            variants = variantsRaw.map(v => ({
                maBienThe: v.maBienThe,
                mauSacSP: v.mauSacSP ? {
                    maMau: v.mauSacSP.maMau,
                    tenMau: v.mauSacSP.tenMau,
                    maHex: v.mauSacSP.maHex
                } : null,
                sizeSP: v.sizeSP ? {
                    maSize: v.sizeSP.maSize,
                    tenSize: v.sizeSP.tenSize
                } : null,
                soLuongTon: v.soLuongTon || 0,
                giaBan: v.giaBan || 0
            }));
        }

        console.log('📦 Loaded variants (raw):', variantsRaw);
        console.log('📦 Loaded variants (processed):', variants);
        console.log('📊 Total variants count:', variants.length);

        // Debug: In ra chi tiết từng variant
        variants.forEach((v, index) => {
            console.log(`Variant ${index}:`, {
                maBienThe: v.maBienThe,
                colorId: v.mauSacSP?.maMau,
                colorName: v.mauSacSP?.tenMau,
                sizeId: v.sizeSP?.maSize,
                sizeName: v.sizeSP?.tenSize,
                stock: v.soLuongTon,
                price: v.giaBan
            });
        });

        // Loại bỏ trùng lặp màu sắc và size khi trang load
        document.addEventListener('DOMContentLoaded', function() {
            removeDuplicateColors();
            removeDuplicateSizes();
            updateSizeAvailability();

            // Auto-select nếu chỉ có 1 lựa chọn
            const colorBtns = document.querySelectorAll('.color-btn:not([style*="display: none"])');
            const sizeBtns = document.querySelectorAll('.size-btn:not([style*="display: none"]):not(:disabled)');

            if (colorBtns.length === 1) {
                colorBtns[0].click();
            }
            if (sizeBtns.length === 1) {
                sizeBtns[0].click();
            }
        });

        function removeDuplicateColors() {
            const colorBtns = document.querySelectorAll('.color-btn');
            const seenColors = new Set();

            colorBtns.forEach(btn => {
                const colorId = btn.getAttribute('data-color-id');
                if (seenColors.has(colorId)) {
                    btn.style.display = 'none';
                } else {
                    seenColors.add(colorId);
                }
            });
        }

        function removeDuplicateSizes() {
            const sizeBtns = document.querySelectorAll('.size-btn');
            const seenSizes = new Set();

            sizeBtns.forEach(btn => {
                const sizeId = btn.getAttribute('data-size-id');
                if (seenSizes.has(sizeId)) {
                    btn.style.display = 'none';
                } else {
                    seenSizes.add(sizeId);
                }
            });
        }

        function selectColor(btn) {
            // Remove selection from all color buttons
            document.querySelectorAll('.color-btn').forEach(b => {
                b.querySelector('.selected-indicator').style.opacity = '0';
            });

            // Add selection to clicked button
            btn.querySelector('.selected-indicator').style.opacity = '1';
            selectedColorId = btn.getAttribute('data-color-id');
            document.getElementById('selectedColorName').textContent = btn.getAttribute('data-color-name');

            console.log('🎨 Selected color:', selectedColorId, btn.getAttribute('data-color-name'));
            console.log('🎨 Selected color ID type:', typeof selectedColorId);

            selectedSizeId = null;
            selectedVariantId = null;
            selectedStock = 0;
            document.getElementById('selectedSizeName').textContent = 'Chọn size';
            document.getElementById('stockInfo').classList.add('hidden');

            document.querySelectorAll('.size-btn').forEach(b => {
                b.classList.remove('border-primary', 'bg-primary', 'text-white');
                b.classList.add('border-text-secondary/30');
            });

            updateSizeAvailability();
        }

        function updateSizeAvailability() {
            const sizeBtns = document.querySelectorAll('.size-btn:not([style*="display: none"])');

            console.log('🔄 Updating size availability for color:', selectedColorId);
            console.log('📏 Found', sizeBtns.length, 'size buttons');

            sizeBtns.forEach(btn => {
                const sizeId = btn.getAttribute('data-size-id');
                const btnColorId = btn.getAttribute('data-color-id');
                const btnStock = parseInt(btn.getAttribute('data-stock') || '0');

                console.log(`\n--- Button size ${sizeId} has color ${btnColorId}, stock ${btnStock} ---`);

                if (selectedColorId) {
                    // Enable only those size buttons that match selected color and have stock
                    const colorMatch = String(btnColorId) === String(selectedColorId);
                    if (colorMatch && btnStock > 0) {
                        btn.disabled = false;
                        btn.classList.remove('opacity-40', 'cursor-not-allowed');
                        // data-variant-id, data-price đã được render sẵn từ backend cho đúng cặp color+size
                        console.log(`✅ Enable size ${sizeId} for color ${selectedColorId} with stock ${btnStock}`);
                    } else {
                        btn.disabled = true;
                        btn.classList.add('opacity-40', 'cursor-not-allowed');
                        console.log(`❌ Disable size ${sizeId} (colorMatch=${colorMatch}, stock=${btnStock})`);
                    }
                } else {
                    // No color selected: show sizes by their stock only
                    if (btnStock > 0) {
                        btn.disabled = false;
                        btn.classList.remove('opacity-40', 'cursor-not-allowed');
                        console.log(`ℹ️ No color selected: size ${sizeId} available, stock ${btnStock}`);
                    } else {
                        btn.disabled = true;
                        btn.classList.add('opacity-40', 'cursor-not-allowed');
                        console.log(`ℹ️ No color selected: size ${sizeId} unavailable`);
                    }
                }
            });
        }

        function selectSize(btn) {
            // Check if button is disabled
            if (btn.disabled) {
                if (typeof showToast === 'function') {
                    showToast('error', 'Hết hàng', 'Size này hiện đã hết hàng với màu đã chọn');
                } else {
                    alert('⚠️ Size này hiện đã hết hàng với màu đã chọn');
                }
                return;
            }

            // Check if color is selected
            if (!selectedColorId) {
                if (typeof showToast === 'function') {
                    showToast('error', 'Chưa chọn màu', 'Vui lòng chọn màu sắc trước');
                } else {
                    alert('⚠️ Vui lòng chọn màu sắc trước');
                }
                return;
            }

            const stock = parseInt(btn.getAttribute('data-stock') || '0');
            if (stock <= 0) {
                if (typeof showToast === 'function') {
                    showToast('error', 'Hết hàng', 'Size này hiện đã hết hàng');
                } else {
                    alert('⚠️ Size này hiện đã hết hàng');
                }
                return;
            }

            // Remove selection from all size buttons
            document.querySelectorAll('.size-btn').forEach(b => {
                b.classList.remove('border-primary', 'bg-primary', 'text-white', 'border-2');
                b.classList.add('border-2', 'border-text-secondary/30');
            });

            // Add selection to clicked button
            btn.classList.remove('border-text-secondary/30');
            btn.classList.add('border-primary', 'bg-primary', 'text-white');

            selectedSizeId = btn.getAttribute('data-size-id');
            selectedVariantId = btn.getAttribute('data-variant-id');
            selectedStock = stock;
            selectedPrice = parseFloat(btn.getAttribute('data-price') || '0');

            document.getElementById('selectedSizeName').textContent = btn.getAttribute('data-size-name');

            console.log('📏 Selected size:', selectedSizeId, 'Stock:', stock, 'Variant ID:', selectedVariantId, 'Price:', selectedPrice);

            // Update stock info
            const stockInfo = document.getElementById('stockInfo');
            const stockText = document.getElementById('stockText');
            stockInfo.classList.remove('hidden');

            if (stock > 10) {
                stockText.innerHTML = `Còn <strong>${stock}</strong> sản phẩm`;
                stockInfo.querySelector('span').className = 'inline-flex items-center gap-2 px-3 py-1.5 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 rounded-lg';
            } else if (stock > 0) {
                stockText.innerHTML = `Chỉ còn <strong>${stock}</strong> sản phẩm`;
                stockInfo.querySelector('span').className = 'inline-flex items-center gap-2 px-3 py-1.5 bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-400 rounded-lg';
            }

            // Update price display
            if (selectedPrice > 0) {
                const priceElement = document.getElementById('productPrice');
                if (priceElement) {
                    priceElement.innerHTML = selectedPrice.toLocaleString('vi-VN') + ' đ';
                }
            }

            // Update quantity max
            document.getElementById('quantity').max = stock;
            if (parseInt(document.getElementById('quantity').value) > stock) {
                document.getElementById('quantity').value = stock;
            }
        }
    </script>
</th:block>
</body>
</html>
