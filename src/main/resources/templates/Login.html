<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      class="light" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng Nhập - Luxury Fashion</title>
    <link th:href="@{/css/Login.css}" rel="stylesheet"/>
    <style>
        .form-checkbox:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="flex flex-1 w-full">
        <div class="flex flex-col lg:flex-row w-full">
            <!-- Left side image - hidden on mobile -->
            <div class="hidden lg:block lg:w-1/2 relative">
                <div class="absolute inset-0 bg-center bg-no-repeat bg-cover"
                     style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDsRkwoHclYd-zDt67R6RUTFK1a70eLo1LqQYce9e_oPoJWlmAGpnr1Kk7_qRAgbmPa6X4NAUts5g4nMv_X6CJtnJWehbp0PT7mB8tN7fC0fLkXZ72ka4n-tcfvyVeQIlxmF-cGUbHjkVXspiksEktzLFmSrC5YCGdgs4bOWe6LZ525iFpwgQKm9z8vtgt8HrMruRX-bNCoHOumWs9cLMiGeJj-kusQslmqYg_OJ7FmRk4L46YT03cKQOcgdZhwLi8Tl1nFJAzVYpU");'>
                </div>
            </div>

            <!-- Right side form -->
            <div class="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-16">
                <div class="w-full max-w-md flex flex-col gap-8">
                    <div class="flex flex-col gap-3 text-center">
                        <h1 class="text-brand-dark-gray dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">Đăng Nhập</h1>
                        <p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Chào mừng trở lại</p>
                    </div>

                    <!-- Error/Success Messages -->
                    <div th:if="${errorMessage}" class="p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                        <p th:text="${errorMessage}"></p>
                    </div>
                    <div th:if="${successMessage}" class="p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                        <p th:text="${successMessage}"></p>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post" class="flex flex-col gap-6">
                        <label class="flex flex-col w-full">
                            <p class="text-brand-dark-gray dark:text-gray-300 text-base font-medium leading-normal pb-2">Số điện thoại hoặc Email</p>
                            <input name="username"
                                   class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-brand-dark-gray dark:text-white dark:bg-background-dark focus:outline-0 focus:ring-2 focus:ring-brand-light-beige border border-brand-light-gray bg-white focus:border-brand-light-beige h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal"
                                   placeholder="Nhập số điện thoại hoặc email"
                                   required/>
                        </label>

                        <label class="flex flex-col w-full">
                            <p class="text-brand-dark-gray dark:text-gray-300 text-base font-medium leading-normal pb-2">Mật khẩu</p>
                            <div class="relative flex w-full flex-1 items-stretch rounded-lg">
                                <input name="password"
                                       id="password"
                                       class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-brand-dark-gray dark:text-white dark:bg-background-dark focus:outline-0 focus:ring-2 focus:ring-brand-light-beige border border-brand-light-gray bg-white focus:border-brand-light-beige h-14 placeholder:text-gray-400 p-[15px] text-base font-normal leading-normal"
                                       placeholder="Nhập mật khẩu"
                                       type="password"
                                       required/>
                                <button type="button"
                                        id="togglePassword"
                                        class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-500 hover:text-brand-dark-gray dark:hover:text-white">
                                    <span class="material-symbols-outlined">visibility</span>
                                </button>
                            </div>
                        </label>

                        <div class="flex justify-between items-center">
                            <label class="flex gap-x-3 items-center cursor-pointer">
                                <input name="remember-me"
                                       class="form-checkbox h-5 w-5 rounded border-brand-light-gray border-2 bg-transparent text-brand-deep-black checked:bg-brand-deep-black checked:border-brand-deep-black focus:ring-2 focus:ring-offset-2 focus:ring-offset-brand-off-white dark:focus:ring-offset-background-dark focus:ring-brand-light-beige focus:outline-none"
                                       type="checkbox"/>
                                <p class="text-brand-dark-gray dark:text-gray-300 text-base font-normal leading-normal">Ghi nhớ đăng nhập</p>
                            </label>
                            <a class="text-sm font-medium text-brand-dark-gray dark:text-gray-300 hover:text-brand-deep-black dark:hover:text-white"
                               href="#"
                               th:href="@{/forgot-password}">Quên mật khẩu?</a>
                        </div>

                        <button type="submit"
                                class="flex items-center justify-center w-full h-14 px-6 py-3 rounded-lg bg-brand-deep-black text-white text-base font-bold uppercase tracking-wider hover:bg-opacity-90 transition-colors">
                            ĐĂNG NHẬP
                        </button>
                    </form>

                    <!-- Google Login -->
                    <a th:href="@{/oauth2/authorization/google}"
                            class="flex items-center justify-center w-full h-14 px-6 py-3 rounded-lg bg-white dark:bg-gray-800 text-brand-dark-gray dark:text-white text-base font-medium border border-brand-light-gray hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                        <img alt="Google logo"
                             class="w-6 h-6 mr-3"
                             src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsPxIsK6O4aFVnJErZKmC0savAjmvvZW3AXC_hOTIWlU_RacOBVDSdltaEVJPSi50hoLbD30aezPR9xOoQkO10ECK0dhHL6bi1Y_fR_FgULlp3bHdnnRRPsslNliYZTHvU8IoRHDUyJrS_nwYV1iK1co179CqNCNilbiMrjchOfsIVVBndBKPLZ5inQXQMXBOKMzla08A367oU2THt1uTshBpLqo0fccbITS-BRYJg5dUEgZ-vLGDbCfWmKZMhhc0VdbntLhmnnhM"/>
                        Đăng nhập bằng Google
                    </a>

                    <!-- Register Link -->
                    <div class="text-center">
                        <p class="text-brand-dark-gray dark:text-gray-300 text-base font-normal">
                            Bạn chưa có tài khoản?
                            <a class="font-bold hover:text-brand-deep-black dark:hover:text-white"
                               href="#"
                               th:href="@{/register}">Đăng ký ngay!</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
